version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Generated vocabulary data has a "DO NOT EDIT" header; skip it entirely.
      - path: internal/vocab/substitutions_gen\.go
        linters:
          - gocritic
          - misspell
          - revive

formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
