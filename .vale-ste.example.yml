# Example configuration for the vale Simplified Technical English linter.
# Copy this file to .vale-ste.yml (project) or ~/.config/vale-ste/config.yml
# (user), and change the values as necessary. vale merges, lowest to highest:
# system -> user (XDG) -> project (.vale-ste.yml) -> project-local
# (.vale-ste.local.yml) -> --config. Scalars from a higher layer win; the
# vocabulary allow/deny lists accumulate across layers. All fields have
# defaults, so the file is optional.

# minSeverity is the gate for the command-line exit code. The linter exits
# with a failure when it finds a problem at this level or higher.
# Values: error, warning, suggestion.
minSeverity: error

# strictVocabulary turns on the check for unapproved words that have no direct
# replacement. It is off by default.
strictVocabulary: false

# sentence sets the word limits for the sentence-length rule.
sentence:
  procedureMax: 20
  descriptionMax: 25

# vocabulary tunes the STE.Vocabulary rule. ASD-STE100 lets a project approve
# Technical Names and Technical Verbs beyond the core dictionary. vale ships a
# built-in set for software and design (commit, cache, token, component, and so
# on), so those words are not flagged.
vocabulary:
  # builtinTechnicalTerms turns the built-in software and design set on or off.
  # It is on by default.
  builtinTechnicalTerms: true
  # allow adds project terms (single words or phrases) to the approved set.
  allow:
    - copilot
    - tauri
    - sidecar
  # deny removes terms from the approved set, so STE checks them again.
  deny: []

# files scopes which paths a directory walk considers. Globs match the path and
# the base name; a leading "**/" matches the base name at any depth. exclude
# wins over include, and a .valeignore file adds exclude patterns. Explicitly
# named file arguments are always linted.
files:
  include: [] # when set, only matching files are linted
  exclude: ["vendor/*", "**/CHANGELOG.md"]

# rules overrides the behavior of one rule. You can disable a rule or change
# its severity.
rules:
  STE.PassiveVoice:
    severity: warning
  STE.Vocabulary:
    disabled: false

# slop turns on the opt-in STE.Slop* family: advisory checks for LLM "slop"
# markers. Off by default. See research/ai-slop/.
slop:
  enabled: false

# model configures the LLM endpoint for `vale eval` and `vale --fix`. Any field
# is overridable on the command line (and temperature via the MCP fix_text tool).
model:
  endpoint: "http://localhost:4141"
  name: "claude-sonnet-5"
  # temperature: 0.2   # unset uses the server default
